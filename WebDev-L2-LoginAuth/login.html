<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to access your dashboard</p>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="loginEmail">Email / Username</label>
                <input type="text" id="loginEmail" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>

            <button type="submit" id="loginBtn">Login</button>
            <p class="error-msg" id="loginError"></p>
        </form>

        <p class="switch-link">Don't have an account? <a href="register.html">Register here</a></p>
    </div>

    <script src="auth.js"></script>
</body>
</html>
