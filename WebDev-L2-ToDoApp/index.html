<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Stay organized, one task at a time</p>

        <div class="progress-wrapper">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-label" id="progressLabel">0 of 0 tasks completed</p>
        </div>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            <button id="addBtn">Add Task</button>
        </div>

        <div class="lists-wrapper">
            <div class="list-column">
                <h2>Pending <span id="pendingCount" class="count-badge">0</span></h2>
                <ul id="pendingList"></ul>
                <p class="empty-state" id="pendingEmpty">No pending tasks. Add one above!</p>
            </div>

            <div class="list-column">
                <h2>Completed <span id="completedCount" class="count-badge">0</span></h2>
                <ul id="completedList"></ul>
                <p class="empty-state" id="completedEmpty">No completed tasks yet.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
